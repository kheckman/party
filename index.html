<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Party Invite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:#14161c;color:#f2f2ea;font-family:"Pixelify Sans",system-ui,sans-serif;font-size:18px;line-height:1.5}
  #lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:
      linear-gradient(#14161c 0 0) top/100% calc(100% - 96px) no-repeat,
      repeating-linear-gradient(90deg,#5b8f3a 0 32px,#4f7f32 32px 64px) bottom 64px left/100% 32px no-repeat,
      repeating-linear-gradient(90deg,#7a5234 0 32px,#6b472c 32px 64px) bottom/100% 64px no-repeat;}
  .card{width:100%;max-width:420px;background:#2a2d36;border:4px solid #0b0c10;
    box-shadow:inset 4px 4px 0 #454a57,inset -4px -4px 0 #1b1d24,0 8px 0 #0b0c10;padding:28px 24px;text-align:center}
  .card h1{font-family:"Press Start 2P",monospace;font-size:16px;line-height:1.7;margin:0 0 12px;color:#ffe066}
  .card p{margin:0 0 20px;color:#c9ccd6}
  .card input{width:100%;padding:14px 12px;font:inherit;font-size:20px;text-align:center;color:#f2f2ea;background:#0f1116;
    border:4px solid #0b0c10;box-shadow:inset 3px 3px 0 #000;outline:none;letter-spacing:1px}
  .card input:focus{border-color:#ffe066}
  .btn{display:inline-block;width:100%;margin-top:14px;padding:16px 12px;font-family:"Press Start 2P",monospace;font-size:13px;
    text-align:center;color:#10210a;background:#6cc04a;border:4px solid #0b0c10;cursor:pointer;text-decoration:none;
    box-shadow:inset 4px 4px 0 #9be07c,inset -4px -4px 0 #3f8a27}
  .btn:hover{background:#7bd157}.btn:active{box-shadow:inset -4px -4px 0 #9be07c,inset 4px 4px 0 #3f8a27}
  .btn[disabled]{opacity:.6;cursor:wait}
  #msg{min-height:1.5em;margin-top:14px;color:#ff8a7a}
  .shake{animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
  @media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
<style id="inner-css"></style>
</head>
<body>
<div id="lock">
  <form class="card" id="gate" autocomplete="off">
    <h1>You're invited!</h1>
    <p>Enter the secret code from your invitation to open it.</p>
    <label for="code" style="position:absolute;left:-9999px">Invitation code</label>
    <input id="code" name="code" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Secret code" required>
    <button class="btn" id="go" type="submit">Unlock</button>
    <div id="msg" role="alert"></div>
  </form>
</div>
<main id="app" hidden></main>

const KEY = 'party-invite-code';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');

async function decrypt(code) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(norm(code)), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64(VAULT.salt), iterations: VAULT.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(VAULT.iv) }, key, b64(VAULT.data));
  return JSON.parse(new TextDecoder().decode(plain));
}

function show(p) {
  document.getElementById('inner-css').textContent = p.css;
  const app = document.getElementById('app');
  app.innerHTML = p.html;
  document.title = p.title || document.title;
  document.getElementById('lock').remove();
  app.hidden = false;
  window.scrollTo(0, 0);
  startCountdown();
}

function startCountdown() {
  const el = document.querySelector('[data-countdown]');
  if (!el) return;
  const target = new Date(el.dataset.countdown).getTime();
  const tick = () => {
    const ms = target - Date.now();
    if (ms <= 0) { el.closest('[data-countdown-wrap]').innerHTML = '<p class="cd-done">The party has started!</p>'; return; }
    const d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24, m = Math.floor(ms / 6e4) % 60, s = Math.floor(ms / 1e3) % 60;
    const set = (k, v) => { const n = el.querySelector('[data-' + k + ']'); if (n) n.textContent = String(v).padStart(2, '0'); };
    set('d', d); set('h', h); set('m', m); set('s', s);
    setTimeout(tick, 1000);
  };
  tick();
}

async function tryCode(code, quiet) {
  const btn = document.getElementById('go'), msg = document.getElementById('msg');
  btn.disabled = true; btn.textContent = 'Opening...'; msg.textContent = '';
  try {
    const p = await decrypt(code);
    try { localStorage.setItem(KEY, norm(code)); } catch (e) {}
    show(p);
  } catch (e) {
    btn.disabled = false; btn.textContent = 'Unlock';
    try { localStorage.removeItem(KEY); } catch (e2) {}
    if (!quiet) {
      msg.textContent = (window.crypto && crypto.subtle) ? "That code didn't work. Check your invitation and try again." : 'This browser cannot open the invitation. Please try another one.';
      const g = document.getElementById('gate'); g.classList.remove('shake'); void g.offsetWidth; g.classList.add('shake');
    }
  }
}

document.getElementById('gate').addEventListener('submit', e => { e.preventDefault(); tryCode(document.getElementById('code').value, false); });
let saved = null; try { saved = localStorage.getItem(KEY); } catch (e) {}
if (saved) tryCode(saved, true);
</script>
